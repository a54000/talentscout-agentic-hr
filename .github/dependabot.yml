version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }   # wait a week before proposing brand-new releases
    groups:
      npm-minor-patch: { update-types: [minor, patch] }
  - package-ecosystem: pip
    directories: [/services/agents, /apps/ats]
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }   # wait a week before proposing brand-new releases
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }   # wait a week before proposing brand-new releases
  - package-ecosystem: docker
    directories: [/apps/api, /apps/web, /services/agents, /apps/ats]
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }   # wait a week before proposing brand-new releases
