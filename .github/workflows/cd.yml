# Continuous delivery: on every merge to main, build each image, scan it, publish an SBOM,
# push to GHCR, then deploy to the optional demo host (skipped when not configured).
# On pull requests it only builds and scans, so a failing image gate is caught before merge.
name: cd

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "**/Dockerfile"
      - "**/package.json"
      - "**/package-lock.json"
      - "**/requirements*.txt"
      - "**/pyproject.toml"
      - "**/uv.lock"
      - ".github/workflows/cd.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TRIVY_IMAGE: aquasec/trivy:0.76.2
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  images:
    name: build, scan, push (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api, context: ., dockerfile: apps/api/Dockerfile }
          - { name: web, context: ., dockerfile: apps/web/Dockerfile }
          - { name: agents, context: services/agents, dockerfile: services/agents/Dockerfile }
          - { name: ats, context: apps/ats, dockerfile: apps/ats/Dockerfile }
          - { name: whatsapp-relay, context: apps/ats/deploy/whatsapp-relay, dockerfile: apps/ats/deploy/whatsapp-relay/Dockerfile }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        env:
          IMAGE: ${{ env.REGISTRY }}/talentscout-${{ matrix.name }}
        run: |
          docker build -f "${{ matrix.dockerfile }}" \
            --label org.opencontainers.image.source="https://github.com/${GITHUB_REPOSITORY}" \
            --label org.opencontainers.image.revision="${GITHUB_SHA}" \
            -t "$IMAGE:${GITHUB_SHA}" -t "$IMAGE:main" "${{ matrix.context }}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Check web server config
        if: matrix.name == 'web'
        run: docker run --rm --add-host api:127.0.0.1 "$IMAGE:${GITHUB_SHA}" nginx -t  # api only resolves inside Compose
      - name: Scan image (block on CRITICAL, report HIGH)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 "$IMAGE:${GITHUB_SHA}"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --severity CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE:${GITHUB_SHA}"
      - name: Generate SBOM (CycloneDX)
        run: |
          mkdir -p sbom
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/sbom:/out" "$TRIVY_IMAGE" \
            image --format cyclonedx --output "/out/${{ matrix.name }}.cdx.json" "$IMAGE:${GITHUB_SHA}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.name }}-${{ github.sha }}
          path: sbom/${{ matrix.name }}.cdx.json
          retention-days: 90
      - name: Push to GHCR
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker push "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:main"

  deploy-demo:
    name: deploy demo (optional)
    needs: images
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: demo
    steps:
      - name: Deploy over SSH, or skip when the demo host is not configured
        env:
          DEMO_HOST: ${{ secrets.DEMO_HOST }}
          DEMO_USER: ${{ secrets.DEMO_USER }}
          DEMO_SSH_KEY: ${{ secrets.DEMO_SSH_KEY }}
          DEMO_KNOWN_HOSTS: ${{ secrets.DEMO_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEMO_HOST" ] || [ -z "$DEMO_SSH_KEY" ]; then
            echo "::notice::Demo host not configured (Sprint 6, TS-E6-05). Images are published; deploy skipped."
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEMO_SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEMO_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh "$DEMO_USER@$DEMO_HOST" "cd talentscout && TAG=${GITHUB_SHA} docker compose -f compose.demo.yml pull && TAG=${GITHUB_SHA} docker compose -f compose.demo.yml up -d"
