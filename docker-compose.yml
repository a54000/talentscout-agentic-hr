# Local stack. Ollama runs NATIVELY on macOS (Metal GPU) - not in Docker.
# HR Guru ATS (live system for recruiters): `docker compose up -d ats-db ats`
# See docs/runbooks/ats-local-restore.md before first start.
#   brew install ollama && ollama serve
#   ollama pull qwen3:8b && ollama pull nomic-embed-text
name: talentscout
services:
  mongo:
    image: mongodb/mongodb-atlas-local:8.0   # $vectorSearch + $search locally, no cost
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      retries: 10

  # --- HR Guru ATS (system of record for candidates, CVs, requirements) ---
  ats-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hrguru_ats
      POSTGRES_USER: hrguru
      POSTGRES_PASSWORD: ${ATS_DB_PASSWORD:?set ATS_DB_PASSWORD in .env}
    volumes: [ats-pgdata:/var/lib/postgresql/data]
    # No host port: the ATS reaches it as ats-db:5432 on the compose network, and restores run
    # inside the ats container. This avoids clashes with other local PostgreSQL servers and keeps
    # the database off the host network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrguru -d hrguru_ats"]
      interval: 10s
      retries: 10
    restart: unless-stopped

  ats:
    build: ./apps/ats
    env_file:
      - path: apps/ats/.env
        required: false
    environment:
      DATABASE_URL: postgresql://hrguru:${ATS_DB_PASSWORD}@ats-db:5432/hrguru_ats
      ATS_UPLOAD_WORKER: external   # bulk uploads are processed by ats-worker (TS-EA-12)
    volumes: [ats-uploads:/app/uploads]
    ports: ["5001:5001"]
    depends_on:
      ats-db: { condition: service_healthy }
    restart: unless-stopped

  # Processes bulk uploads in the background so CV parsing never slows the web server.
  ats-worker:
    build: ./apps/ats
    command: ["python", "upload_worker.py"]
    env_file:
      - path: apps/ats/.env
        required: false
    environment:
      DATABASE_URL: postgresql://hrguru:${ATS_DB_PASSWORD}@ats-db:5432/hrguru_ats
      ATS_UPLOAD_WORKER: external
    volumes: [ats-uploads:/app/uploads]
    depends_on:
      ats-db: { condition: service_healthy }
    restart: unless-stopped

  # Scheduled WhatsApp reports (TS-EA-14). Start with:  docker compose --profile reports up -d
  # WhatsApp Web session for the reports; scan the QR once (runbook section I).
  whatsapp-relay:
    build: ./apps/ats/deploy/whatsapp-relay
    environment:
      WHATSAPP_RELAY_TOKEN: ${WHATSAPP_RELAY_TOKEN:-}   # required: the relay refuses to start without it
      WHATSAPP_GROUP_ID: ${WHATSAPP_GROUP_ID:-}
    volumes: [whatsapp-session:/data]
    ports: ["127.0.0.1:8090:8090"]   # only for scanning the QR on this Mac
    shm_size: 1gb                    # Chromium needs more shared memory than Docker's default
    restart: unless-stopped
    profiles: ["reports"]

  # Runs the six reports at their old EC2 times (IST), separate from the web app.
  ats-scheduler:
    build: ./apps/ats
    command: ["python", "report_scheduler.py"]
    env_file:
      - path: apps/ats/.env
        required: false
    environment:
      DATABASE_URL: postgresql://hrguru:${ATS_DB_PASSWORD}@ats-db:5432/hrguru_ats
      ATS_UPLOAD_WORKER: external
      ATS_PROCESS_ROLE: worker
      ATS_REPORT_STATE_FILE: /app/uploads/.scheduler/state.json
      TEAM_SUBMISSION_WHATSAPP_WEBHOOK_URL: http://whatsapp-relay:8090/send
      TEAM_SUBMISSION_WHATSAPP_TOKEN: ${WHATSAPP_RELAY_TOKEN:-}
      TEAM_SUBMISSION_WHATSAPP_GROUP_ID: ${WHATSAPP_GROUP_ID:-}
    volumes: [ats-uploads:/app/uploads]
    depends_on:
      ats-db: { condition: service_healthy }
      whatsapp-relay: { condition: service_started }
    restart: unless-stopped
    profiles: ["reports"]

  # Cloudflare Tunnel: publishes the ATS at https://ats.hrgp.in with no open ports on the Mac.
  # Only starts with the "live" profile:  docker compose --profile live up -d tunnel
  tunnel:
    image: cloudflare/cloudflared:2026.11.2
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}   # set in .env; cloudflared exits with an error if empty
    depends_on: [ats]
    restart: unless-stopped
    profiles: ["live"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  agents:
    build: ./services/agents
    env_file:
      - path: .env
        required: false
    environment:
      AGENTS_OLLAMA_URL: http://host.docker.internal:11434
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["8000:8000"]
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_started }

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file:
      - path: .env
        required: false
    environment:
      AGENTS_URL: http://agents:8000
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
    ports: ["4000:4000"]
    depends_on: [agents]

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    ports: ["8080:8080"]
    depends_on: [api]

volumes:
  mongo-data:
  ats-pgdata:
  ats-uploads:
  whatsapp-session:
