# Local stack. Ollama runs NATIVELY on macOS (Metal GPU) - not in Docker.
# HR Guru ATS (live system for recruiters): `docker compose up -d ats-db ats`
# See docs/runbooks/ats-local-restore.md before first start.
#   brew install ollama && ollama serve
#   ollama pull qwen3:8b && ollama pull nomic-embed-text
name: talentscout
services:
  mongo:
    image: mongodb/mongodb-atlas-local:8.0   # $vectorSearch + $search locally, no cost
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      retries: 10

  # --- HR Guru ATS (system of record for candidates, CVs, requirements) ---
  ats-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hrguru_ats
      POSTGRES_USER: hrguru
      POSTGRES_PASSWORD: ${ATS_DB_PASSWORD:?set ATS_DB_PASSWORD in .env}
    volumes: [ats-pgdata:/var/lib/postgresql/data]
    # No host port: the ATS reaches it as ats-db:5432 on the compose network, and restores run
    # inside the ats container. This avoids clashes with other local PostgreSQL servers and keeps
    # the database off the host network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrguru -d hrguru_ats"]
      interval: 10s
      retries: 10
    restart: unless-stopped

  ats:
    build: ./apps/ats
    env_file:
      - path: apps/ats/.env
        required: false
    environment:
      DATABASE_URL: postgresql://hrguru:${ATS_DB_PASSWORD}@ats-db:5432/hrguru_ats
    volumes: [ats-uploads:/app/uploads]
    ports: ["5001:5001"]
    depends_on:
      ats-db: { condition: service_healthy }
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  agents:
    build: ./services/agents
    env_file:
      - path: .env
        required: false
    environment:
      AGENTS_OLLAMA_URL: http://host.docker.internal:11434
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["8000:8000"]
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_started }

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file:
      - path: .env
        required: false
    environment:
      AGENTS_URL: http://agents:8000
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
    ports: ["4000:4000"]
    depends_on: [agents]

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    ports: ["8080:8080"]
    depends_on: [api]

volumes:
  mongo-data:
  ats-pgdata:
  ats-uploads:
